name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage web assets
        run: |
          mkdir -p www
          cp index.html app.js manifest.json sw.js icon-192.png icon-512.png apple-touch-icon.png wllama.wasm www/

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Generate app icons
        continue-on-error: true
        run: |
          mkdir -p assets
          sips -z 1024 1024 icon-512.png --out assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          cp assets/icon-only.png assets/icon-background.png
          npx @capacitor/assets generate --ios

      - name: Install pods
        run: |
          cd ios/App
          pod install || true

      - name: Build (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr FocusLock-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-unsigned
          path: FocusLock-unsigned.ipa
