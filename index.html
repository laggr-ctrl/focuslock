<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>FocusLock</title>
  <meta name="description" content="Tasks, wake-up alarms, and a phone lock that earns you your screen time." />
  <meta name="theme-color" content="#0C111D" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FocusLock" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Exo+2:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Audiowide&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0C111D; --card: #151D2E; --card2: #1C2740; --line: rgba(255,255,255,0.07);
      --soft: rgba(255,255,255,0.08); --soft2: rgba(255,255,255,0.14); --soft3: rgba(255,255,255,0.28);
      --accent: #F5A524; --mint: #3FD68F; --red: #F4574D; --text: #EEF2F9; --muted: #8B99B0;
      --bar: rgba(12,17,29,0.94); --font: 'Inter';
    }
    html, body { margin: 0; padding: 0; background: var(--bg); overscroll-behavior-y: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
